[dependency-groups]
dev = [
    "prek>=0.4.14,<1.0.0",
    "typer>=0.27.1,<1.0.0",
    "zizmor>=1.29.0",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv.workspace]
members = ["packages/contracts", "services/user-crud", "services/event-crud", "services/gateway"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "services/gateway/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
    # Argon2 hashes contain accidental letter pairs
    '''\$argon2id\$\S+''',
]

[tool.typos.default.extend-identifiers]
alls = "alls"
