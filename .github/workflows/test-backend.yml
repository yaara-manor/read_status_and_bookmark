name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db redis mailpit
      - name: Test user-crud
        working-directory: services/user-crud
        run: |
          uv run coverage run -m pytest
          uv run coverage html --title "Coverage for ${{ github.sha }}"
      - name: Test event-crud
        working-directory: services/event-crud
        run: |
          uv run coverage run -m pytest
          uv run coverage html --title "Coverage for ${{ github.sha }}"
      - name: Test gateway
        working-directory: services/gateway
        run: uv run pytest
      - run: docker compose down -v --remove-orphans
      - name: Store user-crud coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: services/user-crud/htmlcov
          include-hidden-files: true
      - name: Store event-crud coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html-event
          path: services/event-crud/htmlcov
          include-hidden-files: true
      - name: User CRUD coverage report
        run: uv run coverage report --fail-under=90
        working-directory: services/user-crud
      - name: Event CRUD coverage report
        run: uv run coverage report --fail-under=90
        working-directory: services/event-crud
