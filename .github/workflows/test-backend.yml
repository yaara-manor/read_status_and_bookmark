name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest-known"
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db redis mailpit
      - name: Test user-crud
        working-directory: services/user-crud
        run: |
          uv run coverage run -m pytest
          uv run coverage html --title "Coverage for ${{ github.sha }}"
      - name: Test event-crud
        working-directory: services/event-crud
        run: |
          uv run coverage run -m pytest
          uv run coverage html --title "Coverage for ${{ github.sha }}"
      - name: Test gateway
        working-directory: services/gateway
        run: uv run pytest
      - run: docker compose down -v --remove-orphans
      - name: Store user-crud coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: services/user-crud/htmlcov
          include-hidden-files: true
      - name: Store event-crud coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html-event
          path: services/event-crud/htmlcov
          include-hidden-files: true
      - name: User CRUD coverage report
        run: uv run coverage report --fail-under=90
        working-directory: services/user-crud
      - name: Event CRUD coverage report
        run: uv run coverage report --fail-under=90
        working-directory: services/event-crud
